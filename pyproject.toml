[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "contested-corridor-autonomy"
version = "0.1.0"
description = "Physics-Guided Telemetry Verification and Cognitive-Calibrated Autonomy for Contested Mobility-Energy Corridors"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Faysal Chowdhoury" }]
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "pyyaml>=6.0", "scikit-learn>=1.3",
  "torch>=2.1", "lightgbm>=4.0", "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
